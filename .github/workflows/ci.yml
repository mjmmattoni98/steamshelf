name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties asks for a JDK 17 to run the build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Tests, lint and debug APK
        run: ./gradlew --no-daemon :core:test :server:test lintDebug assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
            core/build/test-results/
            server/build/reports/
            server/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # The web server's image, built the way the Raspberry Pi builds it (without the Android SDK).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the server image
        run: docker build --build-arg VERSION=${{ github.sha }} -t steamshelf-server .

      - name: Smoke test
        run: |
          docker run -d --name steamshelf -p 127.0.0.1:8080:8080 steamshelf-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/login | grep -q "Sign in through Steam"
          docker logs steamshelf
