# Early warning when HowLongToBeat, ProtonDB or Steam change something the app depends on.
# The tests only call public endpoints, so no secrets are needed.
name: Live API check

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Live API tests
        env:
          LIVE_API_TESTS: '1'
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*LiveApiTest*'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-api-results
          path: app/build/test-results/
          if-no-files-found: ignore
